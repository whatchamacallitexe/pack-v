<!DOCTYPE html>
<html lang="en-us">
<base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@104c364f36401fd94165923f6b5a76c113e3540e/baldi%20decomp/">
<head>
<meta charset="utf-8">
<title>Baldi's Basics The Ultra Decompile</title>
<link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" width=1024 height=576></canvas>
<div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
</div>
<script>
var container = document.querySelector("#unity-container");
var canvas = document.querySelector("#unity-canvas");
var loadingBar = document.querySelector("#unity-loading-bar");
var progressBarFull = document.querySelector("#unity-progress-bar-full");
var buildUrl = "Build";
var loaderUrl = buildUrl + "/HTML.loader.js";
var config = {
  dataUrl: buildUrl + "/HTML.data",
  frameworkUrl: buildUrl + "/HTML.framework.js",
  codeUrl: buildUrl + "/HTML.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "Basically Games",
  productName: "Baldi's Basics The Ultra Decompile",
  productVersion: "1.0"
};
loadingBar.style.display = "block";
var script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    progressBarFull.style.width = 100 * progress + "%";
  }).then((unityInstance) => {
    loadingBar.style.display = "none";
  });
};
document.body.appendChild(script);
</script>
</body>
</html>
